name: Offline tests and Windows packages

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        description: Existing vVERSION tag to build and validate
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 22 offline CJS suites and helper protocol/service tests
        run: node scripts/test.mjs
      - name: Build allowlisted extension ZIP and verify reproducibility
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          $buildArgs = @('scripts/build-extension.mjs', '--out', 'dist')
          if ($env:RELEASE_TAG) { $buildArgs += @('--tag', $env:RELEASE_TAG) }
          node @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $first = (Get-FileHash dist/*-extension.zip -Algorithm SHA256).Hash
          node @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $second = (Get-FileHash dist/*-extension.zip -Algorithm SHA256).Hash
          if ($first -cne $second) { throw 'Extension ZIP is not reproducible' }
      - name: Build separate Windows native helper ZIP
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          $buildArgs = @('scripts/build-helper.mjs', '--out', 'dist', '--offline')
          if ($env:RELEASE_TAG) { $buildArgs += @('--tag', $env:RELEASE_TAG) }
          node @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create SHA256SUMS for exactly two ZIP assets
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem dist/*.zip | Sort-Object Name)
          if ($zips.Count -ne 2) { throw 'Expected one extension ZIP and one helper ZIP' }
          $lines = $zips | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS'), (($lines -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
