name: Offline extension tests and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        description: Existing vVERSION tag to build and validate
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 26 offline extension CJS suites (24 standalone and 2 embedded)
        run: node scripts/test.mjs
      - name: Build allowlisted extension ZIP and verify reproducibility
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          $buildArgs = @('scripts/build-extension.mjs', '--out', 'dist')
          if ($env:RELEASE_TAG) { $buildArgs += @('--tag', $env:RELEASE_TAG) }
          node @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $first = (Get-FileHash dist/*-extension.zip -Algorithm SHA256).Hash
          node @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $second = (Get-FileHash dist/*-extension.zip -Algorithm SHA256).Hash
          if ($first -cne $second) { throw 'Extension ZIP is not reproducible' }
      - name: Create SHA256SUMS for exactly one extension ZIP
        shell: pwsh
        run: |
          $zips = @(Get-ChildItem dist/*.zip)
          if ($zips.Count -ne 1 -or $zips[0].Name -cnotmatch '-extension\.zip$') { throw 'Expected exactly one extension ZIP' }
          $line = '{0}  {1}' -f (Get-FileHash $zips[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $zips[0].Name
          [System.IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS'), ($line + "`n"), [System.Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: extension-release-bundle
          path: |
            dist/*-extension.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
